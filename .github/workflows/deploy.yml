name: Deploy WisdomMedium to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [browser, node]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Enforce 98% line and branch coverage
        run: npm run test:coverage:${{ matrix.scope }}

  build:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Check and build static pages
        run: npm run lint && npm run build
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload only the static build
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
